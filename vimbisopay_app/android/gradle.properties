org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Increase timeouts for file operations
org.gradle.workers.max=4
org.gradle.configureondemand=true
# Increase build timeout to 5 minutes (300000 ms)
org.gradle.daemon.idletimeout=300000
# Increase socket timeout for network operations
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.http.connectionTimeout=120000
