plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'com.google.gms.google-services'
    id 'dev.flutter.flutter-gradle-plugin'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}

def flutterRoot = localProperties.getProperty('flutter.sdk')
if (flutterRoot == null) {
    throw new FileNotFoundException("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "com.vimbisopay.vimbisopay_app"
    compileSdkVersion flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
        // For Java 8 features support
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.vimbisopay.vimbisopay_app"
        minSdkVersion 21 // Updated for biometric support
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}

// Custom task to handle APK copying with retry logic
tasks.whenTaskAdded { task ->
    if (task.name == 'assembleDebug') {
        task.doLast {
            def sourceApk = new File("${project.buildDir}/outputs/apk/debug/app-debug.apk")
            def destApk = new File("${project.buildDir}/outputs/flutter-apk/app-debug.apk")
            
            if (sourceApk.exists()) {
                println "Copying APK with custom task: ${sourceApk.path} -> ${destApk.path}"
                
                // Create parent directories if they don't exist
                destApk.parentFile.mkdirs()
                
                // Implement retry logic for file copy
                def maxRetries = 3
                def retryCount = 0
                def success = false
                
                while (!success && retryCount < maxRetries) {
                    try {
                        // Use Java NIO for more reliable file copy
                        java.nio.file.Files.copy(
                            sourceApk.toPath(),
                            destApk.toPath(),
                            java.nio.file.StandardCopyOption.REPLACE_EXISTING
                        )
                        success = true
                        println "APK copied successfully on attempt ${retryCount + 1}"
                    } catch (Exception e) {
                        retryCount++
                        println "Copy failed (attempt ${retryCount}): ${e.message}"
                        if (retryCount < maxRetries) {
                            println "Retrying in 2 seconds..."
                            Thread.sleep(2000)
                        } else {
                            println "Failed to copy APK after ${maxRetries} attempts"
                            throw e
                        }
                    }
                }
            } else {
                println "Source APK not found at: ${sourceApk.path}"
            }
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation "androidx.fragment:fragment-ktx:1.5.5"
    implementation "androidx.biometric:biometric:1.1.0"
    implementation platform('com.google.firebase:firebase-bom:32.7.0')
    implementation 'com.google.firebase:firebase-messaging'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}
